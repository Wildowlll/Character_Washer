<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자캐 세탁기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  :root{
    --bg:#fbf6f0; --card:#ffffff; --ink:#3d3440; --sub:#8b7f8e; --line:#eadfd6;
    --accent:#ff8fab; --accent-ink:#fff; --soft:#fff0f4; --mint:#7fd6b4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  .app{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
  header h1{margin:0;font-size:24px;letter-spacing:-.5px}
  header p{margin:4px 0 0;color:var(--sub);font-size:14px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:18px;align-items:start}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;
    display:flex;justify-content:center;position:relative}
  .stage.drag{outline:3px dashed var(--accent);outline-offset:-8px}
  canvas#cv{width:100%;max-width:480px;height:auto;display:block;border-radius:12px}
  .panel{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:700}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;
    cursor:pointer;font-size:14px;transition:.15s}
  .drop:hover{border-color:var(--accent);background:var(--soft)}
  .drop small{color:var(--sub);font-size:12px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumb{position:relative;width:60px;height:60px;border-radius:10px;background:#f4eee8 center/contain no-repeat;
    border:1px solid var(--line)}
  .thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;
    background:var(--ink);color:#fff;font-size:12px;line-height:20px;cursor:pointer;padding:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:14px}
  .seg{display:flex;background:#f4eee8;border-radius:10px;padding:3px}
  .seg label{position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .seg input:checked+span{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
  input[type=range]{width:140px;accent-color:var(--accent)}
  .sws{display:flex;gap:6px}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:var(--ink)}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;cursor:pointer}
  .check input{accent-color:var(--accent);width:16px;height:16px}
  button.primary{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;
    background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button.primary:active{transform:translateY(1px)}
  button.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;
    font-size:14px;cursor:pointer;color:var(--ink);font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  select{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;background:#fff;color:var(--ink)}
  #status{font-size:13px;color:var(--sub);margin:8px 0 0;min-height:1em}
  #preview{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
  .foot{color:var(--sub);font-size:12px;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🫧 자캐 세탁기</h1>
    <p>자캐를 넣고 돌려보세요. 줄어들거나 이염돼도 책임지지 않습니다.</p>
  </header>
  <main>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <aside class="panel">
      <section class="card">
        <h2>1. 빨래 넣기</h2>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" multiple hidden>
          <span>클릭하거나 이미지를 끌어다 놓기<br><small>배경 투명 PNG 추천 · 최대 4명 · Ctrl+V 붙여넣기 가능</small></span>
        </label>
        <div class="thumbs" id="thumbs"></div>
      </section>

      <section class="card">
        <h2>2. 세탁 설정</h2>
        <div class="row">코스
          <div class="seg">
            <label><input type="radio" name="course" value="std" data-k="course" checked><span>표준</span></label>
            <label><input type="radio" name="course" value="fast" data-k="course"><span>쾌속</span></label>
          </div>
        </div>
        <div class="row">탈수 세기
          <div class="seg">
            <label><input type="radio" name="spin" value="low" data-k="spin"><span>약</span></label>
            <label><input type="radio" name="spin" value="mid" data-k="spin" checked><span>중</span></label>
            <label><input type="radio" name="spin" value="high" data-k="spin"><span>강</span></label>
          </div>
        </div>
        <div class="row">다 빨고 나면
          <div class="seg">
            <label><input type="radio" name="result" value="wrinkle" data-k="result" checked><span>쭈글쭈글</span></label>
            <label><input type="radio" name="result" value="flat" data-k="result"><span>납작</span></label>
            <label><input type="radio" name="result" value="fluffy" data-k="result"><span>뽀송</span></label>
          </div>
        </div>
        <div class="row">세제 양 <input type="range" min="0" max="1" step="0.05" value="0.7" data-k="foam"></div>
        <div class="row">캐릭터 크기 <input type="range" min="0.6" max="1.4" step="0.05" value="1" data-k="size"></div>
        <div class="row">세탁기 색
          <div class="sws" id="sws">
            <button class="sw on" data-color="white" style="background:#eeeeea" title="화이트"></button>
            <button class="sw" data-color="mint" style="background:#bfe6d8" title="민트"></button>
            <button class="sw" data-color="pink" style="background:#f5cad6" title="핑크"></button>
            <button class="sw" data-color="black" style="background:#34373d" title="블랙"></button>
          </div>
        </div>
        <label class="check"><input type="checkbox" data-k="sock">🧦 빨간 양말 같이 넣기</label>
        <label class="check"><input type="checkbox" data-k="sound" checked>🔔 완료 알림음</label>
      </section>

      <section class="card">
        <button class="primary" id="start">▶ 세탁 시작</button>
        <div class="row" style="margin-top:12px">
          <select id="gifsize">
            <option value="0.75">GIF 보통 (360px)</option>
            <option value="0.5625">GIF 작게 (270px)</option>
          </select>
          <button class="secondary" id="gif">GIF로 저장</button>
        </div>
        <p id="status"></p>
        <img id="preview" alt="" hidden>
      </section>
    </aside>
  </main>
  <p class="foot">이미지는 서버로 올라가지 않고 브라우저 안에서만 처리돼요.</p>
</div>

<script>
/* ===================== 기본 상수 / 유틸 ===================== */
const W = 480, H = 580;
const CX = 240, CY = 330, RD = 148, RG = 118;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR;

const TAU = Math.PI * 2;
const rand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* ===================== 상태 ===================== */
const S = { chars: [], course: 'std', spin: 'mid', result: 'wrinkle', foam: 0.7, size: 1, color: 'white', sock: false, sound: true };

const THEMES = {
  white: { body: '#eeeeea', hi: '#fbfbf8', edge: '#c9c9c3', panel: '#e3e3de', text: '#9a9a94' },
  mint:  { body: '#bfe6d8', hi: '#daf4eb', edge: '#8fc4b1', panel: '#b0dccc', text: '#4f8a76' },
  pink:  { body: '#f5cad6', hi: '#fde3ea', edge: '#dc9fb1', panel: '#efbccb', text: '#a65d75' },
  black: { body: '#34373d', hi: '#474b52', edge: '#1e2024', panel: '#2a2d32', text: '#9aa0a8' },
};
const SPIN_MAX = { low: 13, mid: 21, high: 32 };
const SHAKE = { low: 1.5, mid: 3.2, high: 6.5 };
const LABEL = { fill: '급수', wash: '세탁', rinse: '헹굼', drain: '배수', spin: '탈수', stop: '정지', done: '완료' };
const BASE = [['fill', 0.7], ['wash', 3.2], ['rinse', 1.6], ['drain', 0.6], ['spin', 2.8], ['stop', 0.9], ['done', 3.0]];
const POP0 = 0.45, POPG = 0.15, POPD = 0.55;

/* ===================== 타임라인 ===================== */
let TL = null;
function segAt(t, segs = TL.segs) {
  for (const g of segs) if (t < g.start + g.dur) return { g, local: Math.max(0, t - g.start), p: clamp((t - g.start) / g.dur, 0, 1) };
  const g = segs[segs.length - 1];
  return { g, local: g.dur, p: 1 };
}
function omegaAt(t, segs) {
  const { g, local, p } = segAt(t, segs);
  const sm = SPIN_MAX[S.spin];
  switch (g.name) {
    case 'fill':  return 1.2 * p;
    case 'wash':  return 3.2 * Math.tanh(4 * Math.sin(TAU * local / 1.6));
    case 'rinse': return 2.6 * Math.tanh(4 * Math.sin(TAU * local / 1.2));
    case 'drain': return 1.6;
    case 'spin':  return 1.6 + (sm - 1.6) * smooth(0, 1, local / (g.dur * 0.45));
    case 'stop':  return sm * Math.pow(1 - p, 2);
    default:      return 0;
  }
}
function buildTimeline() {
  const k = S.course === 'fast' ? 0.6 : 1;
  let s = 0;
  const segs = BASE.map(([name, d]) => { const dur = name === 'done' ? d : d * k; const o = { name, start: s, dur }; s += dur; return o; });
  const total = s, dt = 1 / 240, N = Math.ceil(total / dt) + 2;
  const ang = new Float32Array(N);
  let a = 0;
  for (let i = 0; i < N; i++) { ang[i] = a; a += omegaAt(i * dt, segs) * dt; }
  TL = { segs, total, ang, dt, doneStart: segs[6].start };
}
function angleAt(t) {
  const i = clamp(t / TL.dt, 0, TL.ang.length - 1), i0 = Math.floor(i), i1 = Math.min(i0 + 1, TL.ang.length - 1);
  return lerp(TL.ang[i0], TL.ang[i1], i - i0);
}
function waterAt(t) {
  const { g, p } = segAt(t);
  switch (g.name) {
    case 'fill': return 0.42 * smooth(0, 1, p);
    case 'wash': case 'rinse': return 0.42;
    case 'drain': return 0.42 * (1 - smooth(0, 1, p));
    default: return 0;
  }
}
function foamAt(t) {
  const { g, p } = segAt(t);
  switch (g.name) {
    case 'fill': return S.foam * p;
    case 'wash': return S.foam;
    case 'rinse': return S.foam * (1 - p);
    default: return 0;
  }
}
function pinkAt(t) {
  if (!S.sock) return 0;
  const w = TL.segs[1];
  return clamp((t - w.start) / w.dur, 0, 1);
}

/* ===================== 스프라이트 가공 ===================== */
function normalize(img) {
  const m = 256, s = m / Math.max(img.width, img.height);
  const c = mk(Math.max(1, Math.round(img.width * s)), Math.max(1, Math.round(img.height * s)));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function tinted(src) {
  const c = mk(src.width, src.height), x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.globalAlpha = 0.45; x.fillStyle = '#ff5f93';
  x.fillRect(0, 0, c.width, c.height);
  return c;
}
function wrinkled(src) {
  const w = src.width, h = src.height, pad = Math.round(Math.max(w, h) * 0.06);
  const a = mk(w + pad * 2, h + pad * 2), ax = a.getContext('2d');
  for (let y = 0; y < h; y += 2) {
    const sh = Math.min(2, h - y);
    const dx = Math.sin(y * 0.11) * w * 0.024 + Math.sin(y * 0.31 + 1) * w * 0.011;
    ax.drawImage(src, 0, y, w, sh, pad + dx, pad + y, w, sh + 0.6);
  }
  const b = mk(a.width, a.height), bx = b.getContext('2d');
  for (let x = 0; x < a.width; x += 2) {
    const sw = Math.min(2, a.width - x);
    const dy = Math.sin(x * 0.13 + 2) * h * 0.022 + Math.sin(x * 0.37) * h * 0.009;
    bx.drawImage(a, x, 0, sw, a.height, x, dy, sw + 0.6, a.height);
  }
  // 주름 선
  bx.globalCompositeOperation = 'source-atop';
  bx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {
    const x0 = rand(i + 1) * b.width, y0 = rand(i + 50) * b.height;
    const len = (0.15 + rand(i + 90) * 0.25) * b.width, an = rand(i + 130) * Math.PI;
    const qx = x0 + Math.cos(an) * len * 0.5 + (rand(i + 7) - 0.5) * 24;
    const qy = y0 + Math.sin(an) * len * 0.5 + (rand(i + 9) - 0.5) * 24;
    const ex = x0 + Math.cos(an) * len, ey = y0 + Math.sin(an) * len;
    bx.strokeStyle = 'rgba(60,40,55,0.24)'; bx.lineWidth = Math.max(1.5, b.width * 0.009);
    bx.beginPath(); bx.moveTo(x0, y0); bx.quadraticCurveTo(qx, qy, ex, ey); bx.stroke();
    bx.strokeStyle = 'rgba(255,255,255,0.32)'; bx.lineWidth = Math.max(1, b.width * 0.005);
    bx.beginPath(); bx.moveTo(x0 + 2, y0 + 2); bx.quadraticCurveTo(qx + 2, qy + 2, ex + 2, ey + 2); bx.stroke();
  }
  return b;
}
function makeChar(img) {
  const spr = normalize(img), wr = wrinkled(spr);
  return { spr, pink: tinted(spr), wrinkle: wr, wrinklePink: tinted(wr), thumb: spr.toDataURL() };
}
function placeholder() {
  const c = mk(220, 240), x = c.getContext('2d');
  x.lineJoin = 'round';
  // 머리 삐침
  x.fillStyle = '#fff'; x.strokeStyle = '#5a4a5e'; x.lineWidth = 7;
  x.beginPath(); x.moveTo(100, 48); x.quadraticCurveTo(108, 12, 128, 20); x.quadraticCurveTo(118, 30, 120, 46); x.fill(); x.stroke();
  // 몸
  x.beginPath(); x.ellipse(110, 138, 94, 92, 0, 0, TAU); x.fill(); x.stroke();
  // 볼
  x.fillStyle = '#ffc2d1';
  x.beginPath(); x.ellipse(60, 158, 16, 10, 0, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(160, 158, 16, 10, 0, 0, TAU); x.fill();
  // 눈
  x.fillStyle = '#3b2f40';
  x.beginPath(); x.ellipse(78, 130, 9, 13, 0, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(142, 130, 9, 13, 0, 0, TAU); x.fill();
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(81, 125, 3.5, 0, TAU); x.fill();
  x.beginPath(); x.arc(145, 125, 3.5, 0, TAU); x.fill();
  // 입
  x.strokeStyle = '#3b2f40'; x.lineWidth = 4;
  x.beginPath(); x.arc(103, 156, 7, 0.1 * Math.PI, 0.9 * Math.PI); x.stroke();
  x.beginPath(); x.arc(117, 156, 7, 0.1 * Math.PI, 0.9 * Math.PI); x.stroke();
  return c;
}
const PH = makeChar(placeholder());
const resultSprite = ch => S.result === 'wrinkle' ? (S.sock ? ch.wrinklePink : ch.wrinkle) : (S.sock ? ch.pink : ch.spr);
const baseSize = () => S.size * 112;
const spriteH = spr => baseSize() * spr.height / Math.max(spr.width, spr.height);

function drawSprite(c, spr, x, y, rot, scale, sx = 1, sy = 1, alpha = 1) {
  const k = baseSize() / Math.max(spr.width, spr.height) * scale;
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y); c.rotate(rot); c.scale(k * sx, k * sy);
  c.drawImage(spr, -spr.width / 2, -spr.height / 2);
  c.restore();
}

/* ===================== 드럼 속 움직임 ===================== */
function charPose(i, n, ang, stuck) {
  const ph = i * TAU / Math.max(n, 1) + 0.7;
  const la = Math.PI / 2 + 0.95 * Math.sin(ang * 0.9 + ph);            // 바닥 근처에서 들렸다 떨어짐
  const lr = RG * (0.38 + 0.14 * Math.sin(ang * 1.3 + ph * 2.1));
  const sa = ang + ph, sr = RG * 0.6;                                    // 탈수: 벽에 붙어서 회전
  const a = lerp(la, sa, stuck), r = lerp(lr, sr, stuck);
  const rot = lerp(0.7 * Math.sin(ang * 0.7 + ph) + ang * 0.25, sa + Math.PI / 2, stuck);
  return { x: Math.cos(a) * r, y: Math.sin(a) * r, rot };
}
const popP = (i, local) => clamp((local - POP0 - i * POPG) / POPD, 0, 1);

/* ===================== 그리기 ===================== */
function drawBody(c, th, t, sg) {
  const { g, local } = sg;
  // 다리
  c.fillStyle = '#55585e';
  rr(c, 72, 498, 40, 16, 4); c.fill();
  rr(c, 368, 498, 40, 16, 4); c.fill();
  // 몸체
  const gr = c.createLinearGradient(40, 0, 440, 0);
  gr.addColorStop(0, th.body); gr.addColorStop(0.5, th.hi); gr.addColorStop(1, th.body);
  rr(c, 40, 36, 400, 470, 30);
  c.fillStyle = gr; c.fill();
  c.save(); c.clip();
  c.fillStyle = th.panel; c.fillRect(40, 36, 400, 94);
  c.fillStyle = th.edge; c.fillRect(40, 130, 400, 2);
  c.restore();
  rr(c, 40, 36, 400, 470, 30);
  c.lineWidth = 3; c.strokeStyle = th.edge; c.stroke();

  // 다이얼
  const idx = t <= 0 ? 0 : TL.segs.indexOf(g);
  for (let k = 0; k < 7; k++) {
    const a = -2.4 + k * 0.8;
    c.fillStyle = k === idx ? '#ff8fab' : th.edge;
    c.beginPath(); c.arc(100 + Math.cos(a) * 40, 84 + Math.sin(a) * 40, k === idx ? 4 : 2.5, 0, TAU); c.fill();
  }
  c.fillStyle = th.hi; c.strokeStyle = th.edge; c.lineWidth = 3;
  c.beginPath(); c.arc(100, 84, 30, 0, TAU); c.fill(); c.stroke();
  const pa = -2.4 + idx * 0.8;
  c.strokeStyle = '#6b6470'; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(100, 84); c.lineTo(100 + Math.cos(pa) * 22, 84 + Math.sin(pa) * 22); c.stroke();

  // LCD
  rr(c, 160, 60, 170, 50, 8); c.fillStyle = '#1d2a26'; c.fill();
  c.fillStyle = '#9ff2c8'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = `bold 17px ${FONT}`;
  c.fillText(t <= 0 ? '준비' : LABEL[g.name] + (g.name === 'spin' ? '!!' : ''), 172, 77);
  c.font = `13px ${FONT}`;
  let line2;
  if (t <= 0) line2 = '빨래를 넣어주세요';
  else if (g.name === 'done') line2 = Math.floor(local * 3) % 2 ? '세탁 완료!' : '';
  else line2 = `남은 시간 ${Math.max(1, Math.ceil((TL.doneStart - t) * 5))}분`;
  c.fillText(line2, 172, 97);

  // 버튼
  const running = t > 0 && g.name !== 'done';
  const doneBlink = g.name === 'done' && Math.floor(local * 3) % 2;
  c.fillStyle = running ? '#7be0a7' : doneBlink ? '#ff8fab' : '#b9b7b2';
  c.strokeStyle = th.edge; c.lineWidth = 3;
  c.beginPath(); c.arc(378, 84, 17, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = th.hi;
  c.beginPath(); c.arc(412, 84, 10, 0, TAU); c.fill(); c.stroke();

  // 로고
  c.fillStyle = th.text; c.textAlign = 'center';
  c.font = `bold 12px ${FONT}`;
  c.fillText('J A C A E   W A S H', CX, 160);
}

function drawDrum(c, ang, stuck) {
  const gr = c.createRadialGradient(CX, CY - 30, 10, CX, CY, RG);
  gr.addColorStop(0, '#59616c'); gr.addColorStop(1, '#1d2026');
  c.fillStyle = gr; c.fillRect(CX - RG, CY - RG, RG * 2, RG * 2);
  c.fillStyle = 'rgba(10,12,15,0.55)';
  for (const r of [30, 52, 74, 96]) {
    const cnt = Math.round(r / 8);
    for (let k = 0; k < cnt; k++) {
      const a = ang + k * TAU / cnt + r * 0.05;
      c.beginPath(); c.arc(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 2.4, 0, TAU); c.fill();
    }
  }
  if (stuck > 0.05) {
    c.strokeStyle = `rgba(255,255,255,${0.08 * stuck})`; c.lineWidth = 2;
    for (const r of [30, 52, 74, 96]) { c.beginPath(); c.arc(CX, CY, r, 0, TAU); c.stroke(); }
  }
  for (let k = 0; k < 3; k++) {
    const a = ang + k * TAU / 3;
    c.save();
    c.translate(CX + Math.cos(a) * (RG - 6), CY + Math.sin(a) * (RG - 6));
    c.rotate(a + Math.PI / 2);
    c.fillStyle = '#7a828d'; rr(c, -16, -9, 32, 18, 8); c.fill();
    c.restore();
  }
}

function drawSock(c, x, y, rot) {
  const k = S.size * 0.9;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(k, k);
  c.fillStyle = '#e23a4f'; c.strokeStyle = '#9e1f31'; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(-14, -40); c.lineTo(14, -40); c.lineTo(14, 10);
  c.quadraticCurveTo(14, 26, 32, 26); c.quadraticCurveTo(46, 28, 44, 40);
  c.quadraticCurveTo(40, 50, 22, 48); c.lineTo(-6, 48); c.quadraticCurveTo(-14, 48, -14, 36);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.fillRect(-12, -35, 24, 5); c.fillRect(-12, -26, 24, 5);
  c.restore();
}

function drawWater(c, t, ang) {
  const lv = waterAt(t);
  if (lv <= 0.001) return;
  const surf = CY + RG - lv * 2 * RG;
  const pk = pinkAt(t);
  const col = [lerp(120, 255, pk), lerp(190, 140, pk), lerp(240, 185, pk)].map(Math.round).join(',');
  const waveY = x => surf + Math.sin(x * 0.045 + t * 5 + ang * 0.6) * 4 + Math.sin(x * 0.09 - t * 3) * 2;
  c.fillStyle = `rgba(${col},0.45)`;
  c.beginPath(); c.moveTo(CX - RG - 5, CY + RG + 5);
  for (let x = CX - RG - 5; x <= CX + RG + 5; x += 6) c.lineTo(x, waveY(x));
  c.lineTo(CX + RG + 5, CY + RG + 5); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 2;
  c.beginPath();
  for (let x = CX - RG - 5; x <= CX + RG + 5; x += 6) x === CX - RG - 5 ? c.moveTo(x, waveY(x)) : c.lineTo(x, waveY(x));
  c.stroke();

  const fm = foamAt(t);
  if (fm <= 0.01) return;
  // 올라오는 기포
  const range = Math.max(10, CY + RG - surf);
  for (let k = 0; k < 36; k++) {
    if (rand(k + 300) > fm) continue;
    const bx = CX + (rand(k) - 0.5) * 1.8 * RG + Math.sin(t * 2 + k) * 4;
    const by = CY + RG - ((rand(k + 100) * range + t * (30 + rand(k + 200) * 40)) % range);
    const r = 2 + rand(k + 400) * 5;
    c.fillStyle = 'rgba(255,255,255,0.15)'; c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1.2;
    c.beginPath(); c.arc(bx, by, r, 0, TAU); c.fill(); c.stroke();
  }
  // 수면 거품
  for (let k = 0; k < 64; k++) {
    if (rand(k + 500) > fm * 1.1) continue;
    const fx = CX + (rand(k + 600) - 0.5) * 2 * RG + Math.sin(t * 1.5 + k) * 3;
    const fy = surf + 4 - rand(k + 700) * fm * 75 + Math.sin(t * 3 + k) * 2;
    const r = 7 + rand(k + 800) * 13 * fm;
    c.fillStyle = '#ffffff'; c.strokeStyle = 'rgba(170,195,220,0.7)'; c.lineWidth = 1.2;
    c.beginPath(); c.arc(fx, fy, r, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = 'rgba(200,225,245,0.6)';
    c.beginPath(); c.arc(fx - r * 0.3, fy - r * 0.3, r * 0.25, 0, TAU); c.fill();
  }
}

function drawDoor(c, th, openP) {
  // 고정 고무 패킹
  c.lineWidth = 12; c.strokeStyle = '#2b2e33';
  c.beginPath(); c.arc(CX, CY, RG + 5, 0, TAU); c.stroke();
  const hingeX = CX - RD;
  const sk = Math.cos(openP * Math.PI * 0.72);
  c.save();
  c.translate(hingeX, CY); c.scale(sk, 1); c.translate(-hingeX, -CY);
  // 유리
  c.fillStyle = 'rgba(170,210,235,0.16)';
  c.beginPath(); c.arc(CX, CY, RG, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.38)'; c.lineWidth = 10; c.lineCap = 'round';
  c.beginPath(); c.arc(CX, CY, RG - 18, -2.6, -1.8); c.stroke();
  c.lineWidth = 5;
  c.beginPath(); c.arc(CX, CY, RG - 18, -1.6, -1.4); c.stroke();
  // 크롬 링
  const rg = c.createLinearGradient(0, CY - RD, 0, CY + RD);
  rg.addColorStop(0, '#fdfdfd'); rg.addColorStop(0.45, '#c9ced5'); rg.addColorStop(1, '#8f959e');
  c.strokeStyle = rg; c.lineWidth = RD - RG;
  c.beginPath(); c.arc(CX, CY, (RD + RG) / 2, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(60,64,72,0.55)'; c.lineWidth = 2;
  c.beginPath(); c.arc(CX, CY, RD, 0, TAU); c.stroke();
  c.beginPath(); c.arc(CX, CY, RG, 0, TAU); c.stroke();
  // 손잡이
  rr(c, CX + RD - 16, CY - 30, 22, 60, 9);
  c.fillStyle = th.edge; c.fill();
  c.restore();
}

function star(c, x, y, r, a) {
  c.save(); c.globalAlpha = a; c.fillStyle = '#ffe27a';
  c.beginPath();
  for (let k = 0; k < 8; k++) {
    const rr2 = k % 2 ? r * 0.3 : r, an = k * Math.PI / 4 - Math.PI / 2;
    k ? c.lineTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2) : c.moveTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2);
  }
  c.closePath(); c.fill(); c.restore();
}

function drawScene(c, t) {
  const th = THEMES[S.color];
  const sg = segAt(t), g = sg.g, local = sg.local;
  const ang = angleAt(t), om = omegaAt(t, TL.segs), stuck = smooth(5, 12, Math.abs(om));
  const list = S.chars.length ? S.chars : [PH];
  const n = list.length, nn = n + (S.sock ? 1 : 0);
  const isDone = g.name === 'done';

  // 배경
  const bg = c.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fdf7ef'); bg.addColorStop(1, '#f3e8da');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.fillStyle = '#e8dac6'; c.fillRect(0, H - 68, W, 68);
  c.fillStyle = 'rgba(120,90,60,0.18)';
  c.beginPath(); c.ellipse(W / 2, H - 62, 215, 12, 0, 0, TAU); c.fill();

  // 덜덜덜
  if (stuck > 0.35) {
    c.font = `bold 20px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = `rgba(130,120,140,${(stuck - 0.35) * 1.2})`;
    for (let k = 0; k < 3; k++) {
      const fi = Math.floor(t * 20) + k;
      c.fillText('덜', 20 + (rand(fi) - 0.5) * 6, 240 + k * 50 + (rand(fi + 7) - 0.5) * 6);
      c.fillText('덜', 460 + (rand(fi + 3) - 0.5) * 6, 260 + k * 50 + (rand(fi + 11) - 0.5) * 6);
    }
  }

  // 흔들림
  const amp = stuck * SHAKE[S.spin], fi = Math.floor(t * 40);
  c.save();
  c.translate((rand(fi) - 0.5) * 2 * amp, (rand(fi + 999) - 0.5) * amp);
  drawBody(c, th, t, sg);

  // 드럼 내부
  c.save();
  c.beginPath(); c.arc(CX, CY, RG, 0, TAU); c.clip();
  drawDrum(c, ang, stuck);
  const pk = pinkAt(t);
  for (let i = 0; i < n; i++) {
    const ch = list[i];
    if (isDone && popP(i, local) > 0) continue;
    const spr = isDone ? resultSprite(ch) : ch.spr;
    if (stuck > 0.25) {
      for (let j = 3; j >= 1; j--) {
        const pg = charPose(i, nn, ang - Math.sign(om) * j * 0.13, stuck);
        drawSprite(c, spr, CX + pg.x, CY + pg.y, pg.rot, 1, 1, 1, 0.22 * stuck / j);
      }
    }
    const ps = charPose(i, nn, ang, stuck);
    drawSprite(c, spr, CX + ps.x, CY + ps.y, ps.rot, 1);
    if (!isDone && pk > 0) drawSprite(c, ch.pink, CX + ps.x, CY + ps.y, ps.rot, 1, 1, 1, pk * 0.85);
  }
  if (S.sock) { const ps = charPose(n, nn, ang, stuck); drawSock(c, CX + ps.x, CY + ps.y, ps.rot); }
  drawWater(c, t, ang);
  c.restore();

  drawDoor(c, th, isDone ? easeInOut(clamp(local / 0.6, 0, 1)) : 0);
  c.restore();

  if (!isDone) return;

  // 띠링♪
  if (local < 1.6) {
    c.font = `bold 22px ${FONT}`; c.textAlign = 'center';
    c.fillStyle = `rgba(255,120,160,${1 - local / 1.6})`;
    c.fillText('♪', 360, 26 - local * 14);
    c.fillText('♫', 396, 34 - local * 18);
  }

  // 튀어나오는 캐릭터
  const spacing = Math.min(125 * S.size, 380 / n);
  for (let i = 0; i < n; i++) {
    const pp = popP(i, local);
    if (pp <= 0) continue;
    const ps = charPose(i, nn, ang, 0);
    const tx = CX + (i - (n - 1) / 2) * spacing, ty = CY + 40;
    const e = easeOut(pp);
    let x = lerp(CX + ps.x, tx, e);
    let y = lerp(CY + ps.y, ty, e) - Math.sin(pp * Math.PI) * 120;
    const sc = lerp(1, 1.4, pp < 1 ? easeOutBack(pp) : 1);
    let rot = lerp(ps.rot, 0, e) + Math.sin(pp * Math.PI) * 0.8;
    let sx = 1, sy = 1;
    const land = local - (POP0 + i * POPG + POPD);
    const spr = resultSprite(list[i]);
    if (land > 0) {
      if (S.result === 'flat') {
        const q = smooth(0, 0.2, land);
        sx = lerp(1, 1.4, q); sy = lerp(1, 0.48, q);
        y += spriteH(spr) * sc / 2 * (1 - sy);
      } else if (S.result === 'wrinkle') {
        rot += Math.sin(land * 38) * 0.05 * Math.exp(-land * 1.5);
      } else {
        y += Math.sin(land * 3.5) * 4;
      }
    }
    drawSprite(c, spr, x, y, rot, sc, sx, sy);
    if (S.result === 'fluffy' && land > 0) {
      const hh = spriteH(spr) * sc / 2;
      for (let k = 0; k < 5; k++) {
        const a = k * TAU / 5 + i;
        star(c, x + Math.cos(a) * hh * 1.05, y + Math.sin(a) * hh * 1.05, 6 + rand(k + i * 9) * 6,
          0.5 + 0.5 * Math.sin(land * 6 + k * 1.7));
      }
    }
  }

  // 캡션
  const allLand = POP0 + (n - 1) * POPG + POPD;
  if (local > allLand) {
    const a = smooth(0, 0.3, local - allLand);
    const txt = { wrinkle: '쭈글쭈글…', flat: '납작…', fluffy: '뽀송뽀송 ✨' }[S.result] + (S.sock ? '  (그리고 분홍색이 됐다)' : '');
    c.font = `bold 17px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const tw = c.measureText(txt).width + 32;
    c.globalAlpha = a;
    rr(c, W / 2 - tw / 2, H - 50, tw, 34, 17); c.fillStyle = '#fff'; c.fill();
    c.strokeStyle = '#eadfd6'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#3d3440'; c.fillText(txt, W / 2, H - 33);
    c.globalAlpha = 1;
  }
}

/* ===================== 재생 ===================== */
let playing = false, startTs = 0, curT = 0, jingled = false, actx = null;
const startBtn = document.getElementById('start');
function updateBtn() { startBtn.textContent = playing ? '⏹ 멈추기' : (curT > 0 ? '↻ 다시 돌리기' : '▶ 세탁 시작'); }
function jingle() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [1318.5, 1046.5, 1568, 2093].forEach((f, i) => {
      const o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const st = actx.currentTime + i * 0.16;
      gn.gain.setValueAtTime(0, st);
      gn.gain.linearRampToValueAtTime(0.18, st + 0.01);
      gn.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
      o.connect(gn).connect(actx.destination);
      o.start(st); o.stop(st + 0.4);
    });
  } catch (e) {}
}
function frame(ts) {
  if (playing) {
    curT = (ts - startTs) / 1000;
    if (!jingled && curT >= TL.doneStart) { jingled = true; if (S.sound) jingle(); }
    if (curT >= TL.total) { curT = TL.total; playing = false; updateBtn(); }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScene(ctx, curT);
  requestAnimationFrame(frame);
}
startBtn.addEventListener('click', () => {
  if (playing) { playing = false; curT = 0; }
  else {
    if (S.sound) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
    curT = 0; startTs = performance.now(); playing = true; jingled = false;
  }
  updateBtn();
});

/* ===================== 설정 UI ===================== */
document.querySelectorAll('[data-k]').forEach(el => {
  el.addEventListener('input', () => {
    if (el.type === 'radio' && !el.checked) return;
    const k = el.dataset.k;
    S[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? parseFloat(el.value) : el.value;
    if (k === 'course' || k === 'spin') { buildTimeline(); if (!playing) curT = Math.min(curT, TL.total); }
  });
});
document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.color = b.dataset.color;
}));

/* ===================== 이미지 넣기 ===================== */
const thumbs = document.getElementById('thumbs');
function renderThumbs() {
  thumbs.innerHTML = '';
  S.chars.forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'thumb'; d.style.backgroundImage = `url(${ch.thumb})`;
    const x = document.createElement('button'); x.textContent = '×'; x.title = '빼기';
    x.onclick = () => { S.chars.splice(i, 1); renderThumbs(); };
    d.appendChild(x); thumbs.appendChild(d);
  });
}
function addFiles(files) {
  const imgs = [...files].filter(f => f.type && f.type.startsWith('image/'));
  const room = 4 - S.chars.length;
  if (room <= 0) { setStatus('세탁기에는 최대 4명까지만 들어가요.'); return; }
  imgs.slice(0, room).forEach(f => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { S.chars.push(makeChar(img)); renderThumbs(); URL.revokeObjectURL(url); };
    img.onerror = () => setStatus('이미지를 읽지 못했어요.');
    img.src = url;
  });
  if (imgs.length > room) setStatus('세탁기에는 최대 4명까지만 들어가요.');
}
document.getElementById('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
const stage = document.getElementById('stage'), drop = document.getElementById('drop');
[stage, drop].forEach(el => {
  el.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
  el.addEventListener('dragleave', () => stage.classList.remove('drag'));
  el.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drag'); addFiles(e.dataTransfer.files); });
});
window.addEventListener('paste', e => {
  const fs = [...(e.clipboardData?.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
  if (fs.length) addFiles(fs);
});

/* ===================== GIF 저장 ===================== */
const statusEl = document.getElementById('status');
const setStatus = s => statusEl.textContent = s;
const gifBtn = document.getElementById('gif');
const WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
let workerURL = null;
gifBtn.addEventListener('click', async () => {
  if (typeof GIF === 'undefined') { setStatus('GIF 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  gifBtn.disabled = true;
  try {
    setStatus('준비 중…');
    if (!workerURL) {
      const r = await fetch(WORKER_SRC);
      workerURL = URL.createObjectURL(await r.blob());
    }
    const scale = parseFloat(document.getElementById('gifsize').value);
    const gw = Math.round(W * scale), gh = Math.round(H * scale);
    const oc = mk(gw, gh), ox = oc.getContext('2d');
    const gif = new GIF({ workers: 2, quality: 10, width: gw, height: gh, workerScript: workerURL });
    const fps = 15, nF = Math.ceil(TL.total * fps);
    for (let f = 0; f <= nF; f++) {
      const t = Math.min(f / fps, TL.total);
      ox.setTransform(scale, 0, 0, scale, 0, 0);
      drawScene(ox, t);
      gif.addFrame(ox, { copy: true, delay: f === nF ? 2000 : Math.round(1000 / fps) });
      if (f % 10 === 0) { setStatus(`프레임 그리는 중… ${f}/${nF}`); await new Promise(r => setTimeout(r, 0)); }
    }
    gif.on('progress', p => setStatus(`GIF 굽는 중… ${Math.round(p * 100)}%`));
    gif.on('finished', blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `jacae_wash_${Date.now()}.gif`; a.click();
      const pv = document.getElementById('preview'); pv.src = url; pv.hidden = false;
      setStatus(`완료! ${(blob.size / 1024 / 1024).toFixed(1)}MB`);
      gifBtn.disabled = false;
    });
    gif.render();
  } catch (err) {
    setStatus('GIF 만들기에 실패했어요: ' + err.message);
    gifBtn.disabled = false;
  }
});

/* ===================== 시작 ===================== */
buildTimeline();
updateBtn();
requestAnimationFrame(frame);
</script>
